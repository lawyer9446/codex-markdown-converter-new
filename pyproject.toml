[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "markdown-html-transformer"
version = "0.1.0"
description = "안전한 Markdown-to-HTML 변환 라이브러리와 CLI"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Markdown HTML Transformer contributors" }]
dependencies = [
  "bleach>=6.1,<7",
  "latex2mathml>=3.77,<4",
  "linkify-it-py>=2.0,<3",
  "markdown-it-py>=3.0,<5",
  "mdit-py-plugins>=0.4,<1",
  "Pygments>=2.17,<3",
  "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
dev = [
  "beautifulsoup4>=4.12,<5",
  "mypy>=1.11,<2",
  "pytest>=8.0,<9",
  "ruff>=0.7,<1",
  "types-bleach>=6.1,<7",
  "types-Pygments>=2.17,<3",
  "types-PyYAML>=6.0,<7",
]

[project.scripts]
md2html = "md_to_html.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/md_to_html"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = [".deps", ".tooling", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["md_to_html"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["mdit_py_plugins.*"]
ignore_missing_imports = true
